<html lang="en">

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400..900;1,400..900&amp;family=Noto+Sans+Thaana:wght@600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#000}
a{color:#C6FF33}a:hover{color:#E4FF8C}
.ar{font-family:'Inter Tight',system-ui,sans-serif;color:#fff;isolation:isolate}
.ar button{font-family:inherit}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.disp{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:-.02em;line-height:.92}
.chrome{background:linear-gradient(100deg,#8C8C97 0%,#FFFFFF 34%,#CFCFD8 52%,#FFFFFF 68%,#9A9AA6 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lbl{display:inline-flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:#BEBECA;white-space:nowrap}
.lbl.dash::before{content:"";width:22px;height:1.5px;background:currentColor}
.num{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.body{font-size:15px;line-height:1.5;font-weight:500;color:#C9C9D3;text-wrap:pretty}
.muted{font-size:13.5px;font-weight:600;color:#BEBECA}
.thaana{font-family:'Noto Sans Thaana',sans-serif;font-weight:700;color:#6FE9F0}

/* arena backdrop */
.bg{position:absolute;inset:0;background:radial-gradient(760px 420px at 50% 50%,rgba(0,188,200,.42),rgba(0,188,200,0) 72%),radial-gradient(1200px 700px at 50% 30%,#12101A 0%,#07070A 55%,#000 100%)}
.bigword{position:absolute;left:0;right:0;top:-8px;text-align:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:300px;line-height:1;letter-spacing:.02em;color:rgba(0,0,0,0);-webkit-text-stroke:1.5px rgba(255,255,255,.07);white-space:nowrap;pointer-events:none}
.beam{position:absolute;top:-60px;width:520px;height:760px;background:linear-gradient(180deg,rgba(111,233,240,.22),rgba(111,233,240,0) 80%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);filter:blur(18px);pointer-events:none}
@keyframes drift{0%{transform:translateY(0);opacity:0}15%{opacity:.8}85%{opacity:.6}100%{transform:translateY(-160px);opacity:0}}
.mote{position:absolute;width:3px;height:3px;border-radius:50%;background:#C6FF33;box-shadow:0 0 8px 2px rgba(198,255,51,.6);animation:drift 7s linear infinite}
.mote.b{background:#6FE9F0;box-shadow:0 0 8px 2px rgba(111,233,240,.6)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,188,200,.16) 1px,rgba(0,0,0,0) 1px),linear-gradient(90deg,rgba(0,188,200,.16) 1px,rgba(0,0,0,0) 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(70% 60% at 50% 40%,#000,rgba(0,0,0,0));mask-image:radial-gradient(70% 60% at 50% 40%,#000,rgba(0,0,0,0))}

/* table */
.stage{position:absolute;inset:0;perspective:2200px;perspective-origin:50% 20%}
.floor{position:absolute;left:-1280px;top:-518px;width:4000px;height:1900px;transform:rotateX(52deg) scale(.86) translateZ(-420px);background-image:radial-gradient(640px 400px at 50% 50%,rgba(0,0,0,.95),rgba(0,0,0,0) 75%),radial-gradient(900px 560px at 50% 50%,rgba(0,188,200,.55),rgba(0,188,200,0) 72%),linear-gradient(rgba(0,188,200,.5) 2px,rgba(0,0,0,0) 2px),linear-gradient(90deg,rgba(0,188,200,.5) 2px,rgba(0,0,0,0) 2px);background-size:auto,auto,110px 110px,110px 110px;background-position:center;-webkit-mask-image:radial-gradient(closest-side,#000 30%,rgba(0,0,0,0) 96%);mask-image:radial-gradient(closest-side,#000 30%,rgba(0,0,0,0) 96%)}
.table{position:absolute;left:120px;top:62px;width:1200px;height:740px;transform-style:preserve-3d;transform:rotateX(52deg) scale(.86)}
.apron{position:absolute;inset:0;border-radius:50%}
.felt{position:absolute;left:68px;top:68px;width:1064px;height:604px;border-radius:50%;transform:translateZ(-5px);background-image:radial-gradient(50% 58% at 50% 46%,rgba(255,255,255,.16),rgba(255,255,255,0) 72%),radial-gradient(closest-side,rgba(0,0,0,0) 56%,rgba(0,0,0,.55) 100%),radial-gradient(circle,rgba(255,255,255,.07) 0 3.2px,rgba(255,255,255,0) 3.8px);background-size:auto,auto,26px 26px;box-shadow:inset 0 26px 50px rgba(0,0,0,.6)}
.rail{position:absolute;inset:0;border-radius:50%;background:radial-gradient(260px 60px at 50% 3%,rgba(255,255,255,.24),rgba(255,255,255,0) 100%),radial-gradient(540px 70px at 50% 98%,rgba(111,233,240,.16),rgba(111,233,240,0) 100%),radial-gradient(600px 370px at 50% 50%,#0B0B0F 0 80%,#141419 83%,#2B2B35 89.5%,#131318 95%,#040405 100%);-webkit-mask-image:radial-gradient(532px 302px at 50% 50%,rgba(0,0,0,0) 99.6%,#000 100%);mask-image:radial-gradient(532px 302px at 50% 50%,rgba(0,0,0,0) 99.6%,#000 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.2),inset 0 0 0 4px #000}
.leds{position:absolute;left:0;top:0;width:1200px;height:740px;transform:translateZ(.6px);overflow:visible}
@keyframes chase{to{stroke-dashoffset:-48}}
.chase{animation:chase 2.4s linear infinite}

/* cards, sized by font-size: 7.2em x 10.08em */
.face{position:absolute;left:0;top:0;width:7.2em;height:10.08em;border-radius:.62em;background:linear-gradient(160deg,#FFFFFF 0%,#F5F5F8 55%,#E7E7EE 100%);color:#0B0B0F;overflow:hidden}
.face.red{color:#E0213A}
.face.ten::before{content:"";position:absolute;inset:.2em;border-radius:.46em;padding:.13em;background:conic-gradient(from 200deg,#C6FF33,#00BCC8,#FFFFFF,#C6FF33,#00BCC8,#FFFFFF,#C6FF33);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.face.ten::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(198,255,51,.2) 42%,rgba(0,188,200,.16) 52%,rgba(255,255,255,0) 64%);background-size:260% 100%;animation:holo 3.4s ease-in-out infinite;pointer-events:none}
@keyframes holo{0%{background-position:130% 0}100%{background-position:-30% 0}}
.idx{position:absolute;display:flex;flex-direction:column;align-items:center;gap:.12em;width:1.4em}
.idx.tl{left:.3em;top:.4em}
.idx.br{right:.3em;bottom:.4em;transform:rotate(180deg)}
.idx b{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.32em;line-height:.9;letter-spacing:-.05em}
.idx svg{width:.72em;height:.72em}
.pips{position:absolute;left:2.38em;right:2.38em;top:1.66em;bottom:1.66em}
.pip{position:absolute;width:1.12em;height:1.12em;margin:-.56em 0 0 -.56em}
.pip.flip{transform:rotate(180deg)}
.ace{position:absolute;left:50%;top:50%;width:3.3em;height:3.3em;margin:-1.65em 0 0 -1.65em}
.court{position:absolute;left:1.8em;right:1.8em;top:1.4em;bottom:1.4em;border-radius:.4em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1em;background:currentColor}
.court::before{content:"";position:absolute;inset:.18em;border-radius:.28em;border:.06em solid rgba(255,255,255,.55)}
.court b{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:2.9em;line-height:1;letter-spacing:-.04em;color:#fff}
.court svg{width:1.05em;height:1.05em;color:#fff}
.back{position:absolute;left:0;top:0;width:7.2em;height:10.08em;border-radius:.62em;background:#00BCC8;overflow:hidden}
.back::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 0%,rgba(255,255,255,.24),rgba(255,255,255,0) 55%),repeating-linear-gradient(45deg,rgba(0,0,0,.26) 0 .1em,rgba(0,0,0,0) .1em .62em),repeating-linear-gradient(-45deg,rgba(0,0,0,.26) 0 .1em,rgba(0,0,0,0) .1em .62em)}
.back::after{content:"";position:absolute;inset:.34em;border-radius:.4em;box-shadow:inset 0 0 0 .08em #fff,inset 0 0 0 .22em #00BCC8,inset 0 0 0 .3em #0B0B0F}
.back i{position:absolute;left:50%;top:50%;width:3em;height:3em;margin:-1.5em 0 0 -1.5em;border-radius:.7em;transform:rotate(45deg);background:#0B0B0F;box-shadow:0 0 0 .08em #C6FF33;display:flex;align-items:center;justify-content:center;z-index:1}
.back i svg{width:1.5em;height:1.5em;color:#C6FF33;transform:rotate(-45deg)}

/* player frames */
.pf{position:absolute;display:flex;align-items:center;gap:12px;height:64px;padding:6px 18px 6px 6px;border-radius:14px;background:rgba(10,10,14,.92);border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 30px -16px rgba(0,0,0,.9)}
.pf.turn{border-color:#C6FF33;box-shadow:0 0 0 4px rgba(198,255,51,.14),0 0 32px rgba(198,255,51,.22)}
.av{position:relative;flex:none;width:52px;height:52px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;color:#0A0A0A;background:linear-gradient(135deg,#E4FF8C 0%,#C6FF33 60%,#A5DD1A 100%)}
.av.them{color:#00191B;background:linear-gradient(135deg,#4FE3EC 0%,#00BCC8 60%,#00727A 100%)}
.ct{position:absolute;right:-8px;bottom:-8px;min-width:24px;height:24px;padding:0 6px;border-radius:7px;background:#fff;color:#000;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;line-height:24px;text-align:center;box-shadow:0 0 0 2px #000}
.nm{display:flex;flex-direction:column;gap:5px}
.nm > b{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;line-height:1;text-transform:uppercase;letter-spacing:.04em}
.nm > span{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;line-height:1;letter-spacing:.16em;text-transform:uppercase;color:#A4A4B2}
.dot{width:7px;height:7px;border-radius:2px;background:#C6FF33;flex:none}
.dot.them{background:#6FE9F0}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(198,255,51,.6)}50%{box-shadow:0 0 0 6px rgba(198,255,51,0)}}
.dot.live{animation:breathe 1.6s ease-in-out infinite}
.fan{position:absolute;width:0;height:0}
.fb{position:absolute;left:-25px;top:-74px;width:50.4px;height:70.6px;font-size:7px;transform-origin:50% 100%;transform:rotate(var(--a)) translateY(-6px);filter:drop-shadow(0 6px 6px rgba(0,0,0,.6))}

/* HUD panels */
.hud{position:absolute;border-radius:14px;background:linear-gradient(180deg,rgba(20,20,26,.94),rgba(9,9,12,.94));border:1px solid rgba(255,255,255,.1);box-shadow:0 22px 44px -20px rgba(0,0,0,.95)}
.hud::before,.hud::after{content:"";position:absolute;width:16px;height:16px;border-style:solid;border-color:#C6FF33;pointer-events:none}
.hud::before{left:-1px;top:-1px;border-width:2px 0 0 2px;border-top-left-radius:14px}
.hud::after{right:-1px;bottom:-1px;border-width:0 2px 2px 0;border-bottom-right-radius:14px}
.hud.b::before,.hud.b::after{border-color:#6FE9F0}
.cell{padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);display:flex;flex-direction:column;gap:8px}
.mini{position:relative;flex:none;width:30px;height:42px;border-radius:6px;background:#fff;color:#0B0B0F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 2px 0 #9D9DAB,0 8px 12px -4px rgba(0,0,0,.8)}
.mini.foil::before{content:"";position:absolute;inset:0;border-radius:6px;padding:2px;background:conic-gradient(from 200deg,#C6FF33,#00BCC8,#FFFFFF,#C6FF33,#00BCC8,#FFFFFF,#C6FF33);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.mini.red{color:#E0213A}
.mini b{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;line-height:1;letter-spacing:-.06em}
.mini svg{width:10px;height:10px}
.mini.ghost{background:rgba(255,255,255,.04);color:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.hex{flex:none;width:66px;height:74px;display:flex;align-items:center;justify-content:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#4FE3EC 0%,#00BCC8 55%,#005A61 100%)}
.hex svg{width:32px;height:32px;color:#04262A;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.hexwrap{position:relative;flex:none;width:66px;height:74px;filter:drop-shadow(0 0 16px rgba(0,188,200,.6))}

/* controls */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:58px;padding:0 26px;border:0;border-radius:12px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;line-height:1;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:#0A0A0A;background:linear-gradient(180deg,#DDFF70 0%,#C6FF33 52%,#B4EE22 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(0,0,0,.14),0 6px 0 #6F9412,0 14px 30px -6px rgba(198,255,51,.4);transition:transform .18s cubic-bezier(.3,1.7,.5,1),box-shadow .18s ease-out}
.btn::after{content:"";position:absolute;inset:0;border-radius:12px;background:linear-gradient(105deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.5) 50%,rgba(255,255,255,0) 62%);background-size:260% 100%;background-position:130% 0;pointer-events:none;transition:background-position .7s ease}
.btn:hover::after,.btn.is-hover::after{background-position:-30% 0}
.btn:active,.btn.is-press{transform:translateY(5px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(0,0,0,.14),0 1px 0 #6F9412,0 6px 14px -6px rgba(198,255,51,.4)}
.btn:active,.ibtn:active{transition-duration:.09s;transition-timing-function:ease-out}
.btn:focus-visible{outline:2px solid #fff;outline-offset:6px}
.btn:disabled{cursor:not-allowed;color:rgba(255,255,255,.45);background:#17171D;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 3px 0 #000;transform:translateY(3px)}
.btn:disabled::after{display:none}
.btn svg{width:19px;height:19px;flex:none}
.btn.blue{color:#00191B;background:linear-gradient(180deg,#4FE3EC 0%,#00BCC8 55%,#0098A3 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.2),0 6px 0 #00727A,0 14px 30px -6px rgba(0,188,200,.5)}
.btn.blue:active,.btn.blue.is-press{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 #00727A,0 6px 14px -6px rgba(0,188,200,.5)}
.btn.ghost{color:#fff;background:#141419;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2),0 5px 0 #000}
.btn.ghost::after{background-image:linear-gradient(105deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.12) 50%,rgba(255,255,255,0) 62%)}
.btn.ghost:hover,.btn.ghost.is-hover{box-shadow:inset 0 0 0 1.5px rgba(198,255,51,.7),0 5px 0 #000}
.btn.ghost:active,.btn.ghost.is-press{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2),0 1px 0 #000;transform:translateY(4px)}
.btn.ghost[aria-pressed="true"]{color:#C6FF33;background:#10130A;box-shadow:inset 0 0 0 1.5px #C6FF33,0 1px 0 #000;transform:translateY(4px)}
.btn.sm{height:48px;padding:0 18px;font-size:14px;border-radius:11px}
.btn.sm::after{border-radius:11px}
.ibtn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;padding:0;border:0;border-radius:12px;cursor:pointer;color:#fff;background:#121217;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 4px 0 #000;transition:transform .18s cubic-bezier(.3,1.7,.5,1),box-shadow .18s ease-out,color .15s}
.ibtn:hover{color:#C6FF33;box-shadow:inset 0 0 0 1px rgba(198,255,51,.6),0 4px 0 #000}
.ibtn:active{transform:translateY(3px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 1px 0 #000}
.ibtn:focus-visible{outline:2px solid #fff;outline-offset:5px}
.ibtn svg{width:21px;height:21px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:#0B0B0E;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.seg button{height:44px;padding:0 16px;border:0;border-radius:10px;background:rgba(0,0,0,0);color:#A4A4B2;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.seg button[aria-pressed="true"]{color:#0A0A0A;background:#fff}
.seg button:focus-visible{outline:2px solid #C6FF33;outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:7px;font-family:'Space Grotesk',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.chip.live{background:rgba(198,255,51,.12);color:#C6FF33;box-shadow:inset 0 0 0 1px rgba(198,255,51,.5)}
.chip.blue{background:rgba(0,188,200,.2);color:#8AF0F5;box-shadow:inset 0 0 0 1px rgba(111,233,240,.6)}
.chip.mono{background:rgba(255,255,255,.06);color:#E4E4EA;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.chip.live i{width:6px;height:6px;border-radius:50%;background:#C6FF33;animation:blink 1.4s ease-in-out infinite}
.status{position:absolute;height:42px;padding:0 20px 0 14px;border-radius:10px;display:flex;align-items:center;gap:10px;transform:translateX(-50%);white-space:nowrap;background:rgba(8,8,11,.92);box-shadow:inset 3px 0 0 #C6FF33,inset 0 0 0 1px rgba(255,255,255,.12),0 12px 26px -12px rgba(0,0,0,.9);font-size:15px;font-weight:600;color:#fff}

/* hand */
.hand{position:absolute;left:0;top:0;width:1440px;height:900px;perspective:1100px;perspective-origin:50% 20%;pointer-events:none}
.hc{position:absolute;left:0;top:0;width:132px;height:185px;padding:0;border:0;background:none;border-radius:11px;font-size:18.333px;cursor:pointer;pointer-events:auto;transform-origin:50% 100%;transform:translate(var(--x),var(--y)) rotate(var(--r)) rotateX(9deg);transition:transform .45s cubic-bezier(.2,.8,.2,1),translate .22s cubic-bezier(.2,.8,.2,1),opacity .18s}
@keyframes handIn{from{translate:0 260px;opacity:0}to{translate:0 0;opacity:1}}
.hc{animation:handIn .75s cubic-bezier(.2,.85,.25,1) backwards;animation-delay:calc(var(--i) * 70ms + 150ms)}
.hc .face{box-shadow:0 1px 0 #DCDCE4,0 2px 0 #C6C6D0,0 3px 0 #ABABB8,0 4px 0 #8F8F9E,0 24px 30px -12px rgba(0,0,0,.85);transition:box-shadow .2s,filter .2s}
.hc:hover:not(:disabled){translate:0 -16px}
.hc.sel,.hc.sel:hover{translate:0 -36px}
.hc.sel .face{box-shadow:0 1px 0 #DCDCE4,0 2px 0 #C6C6D0,0 3px 0 #ABABB8,0 4px 0 #8F8F9E,0 0 0 4px #C6FF33,0 0 36px 6px rgba(198,255,51,.5),0 30px 30px -12px rgba(0,0,0,.8)}
.hc.no{cursor:not-allowed;translate:0 12px}
.hc.no .face{filter:brightness(.5) saturate(.6)}
.hc.wait{cursor:default}
.hc.gone{opacity:0;translate:0 -90px;pointer-events:none}
.hc:focus-visible{outline:none}
.hc:focus-visible .face{box-shadow:0 0 0 3px #fff,0 24px 30px -12px rgba(0,0,0,.8)}

/* popovers */
@keyframes rise{from{transform:translate(-50%,14px) scale(.97);opacity:0}to{transform:translate(-50%,0) scale(1);opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ================= app shell (blue edition) ================= */
.app{position:relative;overflow:hidden;background:#000}
.stagebg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(900px 520px at 70% -10%,rgba(0,188,200,.22),rgba(0,188,200,0) 70%),radial-gradient(700px 500px at 0% 100%,rgba(0,188,200,.12),rgba(0,188,200,0) 70%),linear-gradient(180deg,#07090B 0%,#030405 60%,#000 100%)}
.stagebg::before{content:"";position:absolute;left:-40%;right:-40%;bottom:-2px;height:420px;background-image:linear-gradient(rgba(0,188,200,.34) 1.5px,rgba(0,0,0,0) 1.5px),linear-gradient(90deg,rgba(0,188,200,.34) 1.5px,rgba(0,0,0,0) 1.5px);background-size:84px 84px;background-position:center bottom;transform:perspective(520px) rotateX(58deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(0deg,#000 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,0) 90%);mask-image:linear-gradient(0deg,#000 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,0) 90%)}
.stagebg::after{content:"";position:absolute;right:120px;top:-80px;width:560px;height:900px;background:linear-gradient(180deg,rgba(79,227,236,.12),rgba(79,227,236,0) 75%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);filter:blur(22px);transform:rotate(18deg)}

/* sidebar: collapsed rail (default in the app) */
.side{position:absolute;left:0;top:0;bottom:0;width:84px;z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 0 16px;background:linear-gradient(180deg,rgba(12,12,16,.96),rgba(6,6,9,.96));border-right:1px solid rgba(255,255,255,.08)}
.logo{flex:none;width:40px;height:40px;border-radius:10px;transform:rotate(45deg) scale(.86);display:flex;align-items:center;justify-content:center;background:#0B0B0F;box-shadow:0 0 0 2px #C6FF33,0 0 18px rgba(198,255,51,.35)}
.logo svg{width:22px;height:22px;color:#C6FF33;transform:rotate(-45deg)}
.side .me{position:relative;margin:14px 0 10px}
.side .me .av{width:46px;height:46px;border-radius:12px;font-size:19px}
.pres{position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:#C6FF33;box-shadow:0 0 0 3px #08080B}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{position:relative;display:flex;align-items:center;justify-content:center;width:52px;height:48px;border-radius:12px;color:#8E8E9C;text-decoration:none}
.nav a svg{width:22px;height:22px}
.nav a:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav a[aria-current="page"]{color:#0A0A0A;background:#C6FF33;box-shadow:0 0 22px rgba(198,255,51,.35)}
.nav a .bdg{position:absolute;right:4px;top:4px;min-width:17px;height:17px;padding:0 4px;border-radius:5px;background:#00BCC8;color:#00191B;font:700 10px/17px 'Space Grotesk',sans-serif;text-align:center}
.side .foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px}
.vipbtn{display:flex;align-items:center;justify-content:center;width:52px;height:48px;border-radius:12px;border:0;cursor:pointer;color:#0A0A0A;background:conic-gradient(from 200deg,#C6FF33,#00BCC8,#FFFFFF,#C6FF33,#00BCC8,#FFFFFF,#C6FF33);box-shadow:0 0 18px rgba(0,188,200,.35)}
.vipbtn svg{width:22px;height:22px}
.mini-soc{position:relative;display:flex;align-items:center;justify-content:center;width:52px;height:44px;border-radius:12px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);color:#BEBECA}
.mini-soc svg{width:20px;height:20px}
.mini-soc .bdg{position:absolute;right:3px;top:3px;min-width:17px;height:17px;padding:0 4px;border-radius:5px;background:#C6FF33;color:#0A0A0A;font:700 10px/17px 'Space Grotesk',sans-serif;text-align:center}

/* sidebar: expanded panel */
.side.open{width:256px;align-items:stretch;padding:18px 16px 16px}
.side.open .head{display:flex;align-items:center;gap:14px;padding:0 4px}
.side.open .head .word{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;letter-spacing:-.01em;text-transform:uppercase}
.side.open .head .tog{margin-left:auto;width:36px;height:36px;border-radius:10px}
.side.open .head .tog svg{width:18px;height:18px}
.side.open .ident{display:flex;align-items:center;gap:12px;margin:18px 0 12px;padding:10px;border-radius:14px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.side.open .ident .av{width:44px;height:44px;border-radius:11px;font-size:18px}
.side.open .nav a{justify-content:flex-start;gap:14px;width:auto;height:44px;padding:0 14px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.side.open .nav a svg{width:20px;height:20px}
.side.open .nav a .bdg{position:static;margin-left:auto}
.side.open .foot{align-items:stretch;gap:10px}
.vipcard{position:relative;overflow:hidden;padding:14px 14px 14px;border-radius:14px;background:linear-gradient(160deg,#0B2629 0%,#07141A 100%);box-shadow:inset 0 0 0 1px rgba(0,188,200,.45)}
.vipcard::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(closest-side,rgba(198,255,51,.28),rgba(198,255,51,0))}
.soc{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.soc .row1{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#D4D4DC}
.soc .row1 svg{width:15px;height:15px;margin-left:auto;color:#8E8E9C}
.stack{display:flex;align-items:center;margin-top:9px}
.stack .ava{width:28px;height:28px;border-radius:8px;font-size:12px;margin-right:-6px;box-shadow:0 0 0 2px #0A0A0D}
.stack .more{margin-left:12px;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;color:#A4A4B2}

/* small avatars */
.ava{position:relative;flex:none;display:flex;align-items:center;justify-content:center;border-radius:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;color:#0A0A0A;background:linear-gradient(135deg,#E4FF8C,#C6FF33 60%,#A5DD1A)}
.ava.b{color:#00191B;background:linear-gradient(135deg,#4FE3EC,#00BCC8 60%,#00727A)}
.ava.w{color:#0A0A0A;background:linear-gradient(135deg,#FFFFFF,#D9D9E2)}
.ava.g{color:#fff;background:linear-gradient(135deg,#3A3A46,#1C1C24)}
.ava.o{color:#0A0A0A;background:linear-gradient(135deg,#FFE58A,#E0B52E)}
.ava .on{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:#C6FF33;box-shadow:0 0 0 2.5px #0B0B0F}
.ava .on.off{background:#4A4A56}
.ava .on.game{background:#00BCC8}

/* top bar */
.top{position:absolute;right:0;top:0;height:76px;z-index:15;display:flex;align-items:center;gap:14px;padding:0 32px 0 28px;border-bottom:1px solid rgba(255,255,255,.06);background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,.35))}
.search{display:flex;align-items:center;gap:10px;width:380px;height:44px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:#8E8E9C;font-size:14px;font-weight:500}
.search svg{width:18px;height:18px}
.search kbd{margin-left:auto;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.06);font:600 11px 'Space Grotesk',sans-serif;color:#A4A4B2}
.coins{display:flex;align-items:center;gap:9px;height:44px;padding:0 8px 0 10px;border-radius:12px;background:rgba(10,10,14,.8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.gem{flex:none;width:22px;height:22px;border-radius:6px;transform:rotate(45deg) scale(.82);background:linear-gradient(135deg,#E4FF8C,#C6FF33 55%,#8FC20F);box-shadow:0 0 12px rgba(198,255,51,.6)}
.gem.sm{width:15px;height:15px;border-radius:4px}
.coins .add{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:0;border-radius:8px;background:#C6FF33;color:#0A0A0A;cursor:pointer}
.coins .add svg{width:16px;height:16px}
.bell{position:relative}
.bell .dotc{position:absolute;right:-4px;top:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:6px;background:#00BCC8;color:#00191B;font:700 11px/19px 'Space Grotesk',sans-serif;text-align:center;box-shadow:0 0 0 2px #000}
.chipme{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px 0 4px;border-radius:12px;background:rgba(10,10,14,.8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.chipme .ava{width:40px;height:40px;border-radius:9px;font-size:17px}
.chipme b{display:block;font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.chipme svg.cv{width:16px;height:16px;color:#8E8E9C}

/* rank badge */
.rank{display:inline-flex;align-items:center;gap:6px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;line-height:1}
.rank i{flex:none;width:12px;height:13px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.rank.gold{color:#E6C24A}.rank.gold i{background:linear-gradient(160deg,#FFE58A,#E0B52E 55%,#9A7512)}
.rank.silver{color:#D2D6DA}.rank.silver i{background:linear-gradient(160deg,#FFFFFF,#B9C2C9 55%,#6F7B84)}
.rank.bronze{color:#E09A62}.rank.bronze i{background:linear-gradient(160deg,#F0B587,#B0703A 55%,#6E3F1B)}
.rank.plat{color:#E9ECEF}.rank.plat i{background:linear-gradient(160deg,#FFFFFF,#E5E4E2 45%,#A7A9AC 70%,#8AF0F5)}
.rk{flex:none;display:flex;align-items:center;justify-content:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.rk svg{color:rgba(0,0,0,.66)}
.rk.gold{background:linear-gradient(160deg,#FFE58A 0%,#E0B52E 55%,#9A7512 100%)}
.rk.silver{background:linear-gradient(160deg,#FFFFFF 0%,#B9C2C9 55%,#6F7B84 100%)}
.rk.bronze{background:linear-gradient(160deg,#F0B587 0%,#B0703A 55%,#6E3F1B 100%)}
.rk.plat{background:linear-gradient(160deg,#FFFFFF 0%,#E5E4E2 45%,#A7A9AC 70%,#8AF0F5 100%)}

/* page frame */
.page{position:absolute;right:0;top:76px;bottom:0;padding:28px 32px 32px 32px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.phead h1{margin:10px 0 0;font-size:56px}
.sub{margin:10px 0 0;font-size:15px;line-height:1.45;font-weight:500;color:#C4C4CE}
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(10,10,14,.85);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.tabs button{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border:0;border-radius:10px;background:rgba(0,0,0,0);color:#A4A4B2;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.tabs button svg{width:16px;height:16px}
.tabs button[aria-pressed="true"]{color:#0A0A0A;background:#C6FF33}
.tabs button:disabled{cursor:not-allowed;color:#5E5E6A}
.tabs button .n{min-width:20px;height:20px;padding:0 5px;border-radius:6px;background:#00BCC8;color:#00191B;font-size:11px;line-height:20px;letter-spacing:0;text-align:center}
.tabs button[aria-pressed="true"] .n{background:#0A0A0A;color:#C6FF33}
.soon{padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.07);color:#8E8E9C;font-size:9.5px;letter-spacing:.1em}
.panel{position:relative;border-radius:16px;background:linear-gradient(180deg,rgba(20,20,26,.92),rgba(9,9,12,.92));border:1px solid rgba(255,255,255,.1);box-shadow:0 22px 44px -22px rgba(0,0,0,.95)}
.panel.tick::before,.panel.tick::after{content:"";position:absolute;width:16px;height:16px;border-style:solid;border-color:#C6FF33;pointer-events:none}
.panel.tick::before{left:-1px;top:-1px;border-width:2px 0 0 2px;border-top-left-radius:16px}
.panel.tick::after{right:-1px;bottom:-1px;border-width:0 2px 2px 0;border-bottom-right-radius:16px}
.panel.tick.b::before,.panel.tick.b::after{border-color:#00BCC8}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ph h2{margin:0;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.01em;text-transform:uppercase}
.link{display:inline-flex;align-items:center;gap:4px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#C6FF33;text-decoration:none}
.link svg{width:14px;height:14px}
.link.b{color:#00BCC8}
.meter{position:relative;height:10px;border-radius:3px;background:#0B0B0F;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#8FC20F,#C6FF33);box-shadow:0 0 12px rgba(198,255,51,.55)}
.meter.b i{background:linear-gradient(90deg,#00838C,#00BCC8);box-shadow:0 0 12px rgba(0,188,200,.5)}
.meter.seg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 22px,rgba(0,0,0,.55) 22px 24px)}
.meter.thin{height:6px}
.field{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:#8E8E9C;font-size:14px;font-weight:500}
.field svg{width:17px;height:17px}
.field b{color:#fff;font-weight:600}
.select{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 14px;border-radius:10px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);font-size:13.5px;font-weight:600;color:#E4E4EA}
.select svg{width:15px;height:15px;color:#8E8E9C}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.pill.lime{background:#C6FF33;color:#0A0A0A}
.pill.blue{background:#00BCC8;color:#00191B}
.pill.dim{background:rgba(255,255,255,.07);color:#BEBECA}
.pill.line{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);color:#E4E4EA}
.pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.4s ease-in-out infinite}
.pill svg{width:13px;height:13px}
.divider{height:1px;background:rgba(255,255,255,.08)}
.muted2{font-size:12.5px;font-weight:600;color:#A4A4B2}
.tnum{font-variant-numeric:tabular-nums}

/* rarity */
.rar{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.rar.common{color:#BEBECA}.rar.rare{color:#00BCC8}.rar.epic{color:#C6FF33}.rar.legendary{color:#FFC940}

/* mini card-back art, sized by font-size (7.2em x 10.08em) */
.cb{position:relative;width:7.2em;height:10.08em;border-radius:.62em;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.15),0 14px 22px -10px rgba(0,0,0,.9)}
.cb::before,.cb::after{content:"";position:absolute}
.cb::after{inset:.34em;border-radius:.4em}
.cb i{position:absolute;left:50%;top:50%;width:3em;height:3em;margin:-1.5em 0 0 -1.5em;border-radius:.7em;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;z-index:1}
.cb i svg{width:1.5em;height:1.5em;transform:rotate(-45deg)}
.cb.arena{background:#00BCC8}
.cb.arena::before{inset:0;background:radial-gradient(120% 80% at 20% 0%,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),repeating-linear-gradient(45deg,rgba(0,0,0,.24) 0 .1em,rgba(0,0,0,0) .1em .62em),repeating-linear-gradient(-45deg,rgba(0,0,0,.24) 0 .1em,rgba(0,0,0,0) .1em .62em)}
.cb.arena::after{box-shadow:inset 0 0 0 .08em #fff,inset 0 0 0 .22em #00BCC8,inset 0 0 0 .3em #0B0B0F}
.cb.arena i{background:#0B0B0F;box-shadow:0 0 0 .08em #C6FF33}.cb.arena i svg{color:#C6FF33}
.cb.gold{background:#141210}
.cb.gold::before{inset:0;background:radial-gradient(120% 80% at 20% 0%,rgba(255,236,200,.14),rgba(255,236,200,0) 55%),repeating-linear-gradient(45deg,rgba(214,176,90,.32) 0 .07em,rgba(0,0,0,0) .07em .52em),repeating-linear-gradient(-45deg,rgba(214,176,90,.32) 0 .07em,rgba(0,0,0,0) .07em .52em)}
.cb.gold::after{box-shadow:inset 0 0 0 .08em #D6B05A,inset 0 0 0 .22em #141210,inset 0 0 0 .28em rgba(214,176,90,.5)}
.cb.gold i{background:#141210;box-shadow:0 0 0 .08em #D6B05A}.cb.gold i svg{color:#D6B05A}
.cb.sunset{background:linear-gradient(180deg,#FF8A5B 0%,#F2456B 45%,#4A1F6B 100%)}
.cb.sunset::before{left:0;right:0;bottom:0;height:38%;background:repeating-linear-gradient(180deg,rgba(255,255,255,.22) 0 .08em,rgba(255,255,255,0) .08em .5em)}
.cb.sunset::after{box-shadow:inset 0 0 0 .08em rgba(255,255,255,.85)}
.cb.sunset i{background:rgba(0,0,0,.35);box-shadow:0 0 0 .08em #FFE0B8}.cb.sunset i svg{color:#FFE0B8}
.cb.wood{background:#4A2A17}
.cb.wood::before{inset:0;background:repeating-linear-gradient(92deg,rgba(0,0,0,.24) 0 .12em,rgba(255,220,170,.07) .12em .3em,rgba(0,0,0,0) .3em .9em),radial-gradient(120% 80% at 20% 0%,rgba(255,236,200,.16),rgba(255,236,200,0) 55%)}
.cb.wood::after{box-shadow:inset 0 0 0 .08em #D8B66F}
.cb.wood i{background:#2E1A0E;box-shadow:0 0 0 .08em #D8B66F}.cb.wood i svg{color:#D8B66F}
.cb.ocean{background:linear-gradient(180deg,#0B3A5E,#061A2E)}
.cb.ocean::before{inset:0;background:repeating-radial-gradient(circle at 50% 120%,rgba(111,233,240,0) 0 .5em,rgba(111,233,240,.22) .5em .58em)}
.cb.ocean::after{box-shadow:inset 0 0 0 .08em #6FE9F0}
.cb.ocean i{background:#061A2E;box-shadow:0 0 0 .08em #6FE9F0}.cb.ocean i svg{color:#6FE9F0}
.cb.inferno{background:linear-gradient(0deg,#FFB02E 0%,#FF4D1F 35%,#7A0F0F 75%,#1A0505 100%)}
.cb.inferno::before{inset:0;background:radial-gradient(40% 30% at 30% 90%,rgba(255,240,150,.6),rgba(255,240,150,0)),radial-gradient(35% 28% at 72% 85%,rgba(255,240,150,.5),rgba(255,240,150,0))}
.cb.inferno::after{box-shadow:inset 0 0 0 .08em rgba(255,210,120,.9)}
.cb.inferno i{background:#1A0505;box-shadow:0 0 0 .08em #FFB02E}.cb.inferno i svg{color:#FFB02E}
.cb.marble{background:linear-gradient(135deg,#FFFFFF,#E3E3E8)}
.cb.marble::before{inset:0;background:linear-gradient(120deg,rgba(0,0,0,0) 30%,rgba(120,120,135,.35) 31%,rgba(0,0,0,0) 33%),linear-gradient(60deg,rgba(0,0,0,0) 55%,rgba(120,120,135,.28) 56%,rgba(0,0,0,0) 57.5%),linear-gradient(150deg,rgba(0,0,0,0) 70%,rgba(150,150,160,.3) 71%,rgba(0,0,0,0) 72%)}
.cb.marble::after{box-shadow:inset 0 0 0 .08em #9A9AA6}
.cb.marble i{background:#fff;box-shadow:0 0 0 .08em #6A6A76}.cb.marble i svg{color:#3A3A46}
.cb.frost{background:linear-gradient(160deg,#E8FBFF,#9FDDF0 50%,#3F8FB5)}
.cb.frost::before{inset:0;background:repeating-linear-gradient(60deg,rgba(255,255,255,.45) 0 .05em,rgba(255,255,255,0) .05em .7em),repeating-linear-gradient(-60deg,rgba(255,255,255,.45) 0 .05em,rgba(255,255,255,0) .05em .7em)}
.cb.frost::after{box-shadow:inset 0 0 0 .08em #fff}
.cb.frost i{background:#0D3550;box-shadow:0 0 0 .08em #E8FBFF}.cb.frost i svg{color:#E8FBFF}
.cb.shadow{background:#121018}
.cb.shadow::before{inset:0;background:radial-gradient(90% 60% at 50% 50%,rgba(0,188,200,.4),rgba(0,188,200,0) 70%),repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 .1em,rgba(0,0,0,0) .1em .62em)}
.cb.shadow::after{box-shadow:inset 0 0 0 .08em #6FE9F0,inset 0 0 0 .22em #121018,inset 0 0 0 .28em rgba(111,233,240,.4)}
.cb.shadow i{background:#0B0B0F;box-shadow:0 0 0 .08em #6FE9F0}.cb.shadow i svg{color:#6FE9F0}
.cb.neon{background:#07070A}
.cb.neon::before{inset:0;background:repeating-linear-gradient(0deg,rgba(198,255,51,.24) 0 .06em,rgba(0,0,0,0) .06em .7em),repeating-linear-gradient(90deg,rgba(0,188,200,.42) 0 .06em,rgba(0,0,0,0) .06em .7em)}
.cb.neon::after{box-shadow:inset 0 0 0 .08em #C6FF33,inset 0 0 .5em rgba(198,255,51,.5)}
.cb.neon i{background:#07070A;box-shadow:0 0 0 .08em #C6FF33}.cb.neon i svg{color:#C6FF33}
.cb.dragon{background:linear-gradient(160deg,#0E3B25,#06140D)}
.cb.dragon::before{inset:0;background:radial-gradient(circle at 50% 0,rgba(0,0,0,0) .32em,rgba(80,200,120,.4) .34em,rgba(0,0,0,0) .42em);background-size:.9em .6em}
.cb.dragon::after{box-shadow:inset 0 0 0 .08em #FFC940,inset 0 0 0 .22em #06140D,inset 0 0 0 .28em rgba(255,201,64,.5)}
.cb.dragon i{background:#06140D;box-shadow:0 0 0 .08em #FFC940}.cb.dragon i svg{color:#FFC940}
.cb.phoenix{background:radial-gradient(80% 60% at 50% 60%,#FF9D2E,#D8341B 55%,#3A0A12)}
.cb.phoenix::before{inset:0;background:conic-gradient(from 180deg at 50% 62%,rgba(255,230,140,0) 0deg,rgba(255,230,140,.45) 20deg,rgba(255,230,140,0) 40deg,rgba(255,230,140,.35) 70deg,rgba(255,230,140,0) 100deg,rgba(255,230,140,0) 260deg,rgba(255,230,140,.35) 290deg,rgba(255,230,140,0) 320deg,rgba(255,230,140,.45) 340deg,rgba(255,230,140,0) 360deg)}
.cb.phoenix::after{box-shadow:inset 0 0 0 .08em #FFE08A}
.cb.phoenix i{background:#3A0A12;box-shadow:0 0 0 .08em #FFE08A}.cb.phoenix i svg{color:#FFE08A}
.cb.vip{background:conic-gradient(from 200deg,#C6FF33,#00BCC8,#FFFFFF,#C6FF33,#00BCC8,#FFFFFF,#C6FF33)}
.cb.vip::after{inset:.3em;background:#0B0B0F;box-shadow:inset 0 0 0 .06em rgba(255,255,255,.5)}
.cb.vip i{background:#FFC940;box-shadow:0 0 0 .08em #0B0B0F,0 0 1em rgba(255,201,64,.6)}.cb.vip i svg{color:#0B0B0F}

/* table theme swatch */
.tt{position:relative;border-radius:50%;box-shadow:inset 0 0 0 .5em #0B0B0F,inset 0 0 0 .62em rgba(255,255,255,.25),0 12px 20px -10px rgba(0,0,0,.9)}
.tt::after{content:"";position:absolute;inset:.62em;border-radius:50%;background:radial-gradient(60% 60% at 50% 45%,rgba(255,255,255,.22),rgba(255,255,255,0) 70%)}
.tt.neon{background:#06323A;box-shadow:inset 0 0 0 .5em #0B0B0F,inset 0 0 0 .66em #C6FF33,0 0 1em rgba(198,255,51,.35),0 12px 20px -10px rgba(0,0,0,.9)}
.tt.midnight{background:#101214}.tt.oak{background:#6B4424}.tt.crimson{background:#4A1119}.tt.sapphire{background:#0E2C4E}
.tt.palace{background:#3A2A08;box-shadow:inset 0 0 0 .5em #0B0B0F,inset 0 0 0 .66em #FFC940,0 12px 20px -10px rgba(0,0,0,.9)}
.tt.frozen{background:#9FDDF0}.tt.magma{background:#7A1A0F}.tt.cosmic{background:radial-gradient(circle at 30% 30%,#16306E,#050510)}
.cardw{position:relative;flex:none}
.cardw .face{box-shadow:0 1px 0 #DCDCE4,0 2px 0 #C6C6D0,0 3px 0 #ABABB8,0 14px 20px -8px rgba(0,0,0,.85)}
a.btn{text-decoration:none}
.side.tall .foot{margin-top:28px}
.gname{display:flex;align-items:baseline;gap:12px}
.gname .thaana{font-size:16px;color:#6FE9F0}
.page > *{flex-shrink:0}
.wr{position:relative;width:96px;height:96px;align-self:center}
.wr svg{position:absolute;inset:0;width:96px;height:96px;transform:rotate(-90deg)}
.wr b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:24px;letter-spacing:-.02em}
.btn.ghost:disabled,.btn.blue:disabled{cursor:not-allowed;color:rgba(255,255,255,.42);background:#17171D;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 3px 0 #000;transform:translateY(3px)}
.link{white-space:nowrap}

/* ================= mobile shell: portrait phone, 390 wide ================= */
.m{background:#000}
/* stage: fixed to the viewport in the app (position: fixed), drawn once at the top here */
.mstage{position:absolute;left:0;right:0;top:0;height:844px;pointer-events:none;overflow:hidden;background:radial-gradient(340px 260px at 92% -20px,rgba(0,188,200,.30),rgba(0,188,200,0) 70%),radial-gradient(280px 300px at -8% 560px,rgba(0,188,200,.12),rgba(0,188,200,0) 70%),linear-gradient(180deg,#07090B 0%,#030405 62%,#000 100%)}
.mstage::before{content:"";position:absolute;left:-70%;right:-70%;bottom:-2px;height:330px;background-image:linear-gradient(rgba(0,188,200,.32) 1.5px,rgba(0,0,0,0) 1.5px),linear-gradient(90deg,rgba(0,188,200,.32) 1.5px,rgba(0,0,0,0) 1.5px);background-size:56px 56px;background-position:center bottom;transform:perspective(340px) rotateX(58deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(0deg,#000 0%,rgba(0,0,0,.5) 45%,rgba(0,0,0,0) 90%);mask-image:linear-gradient(0deg,#000 0%,rgba(0,0,0,.5) 45%,rgba(0,0,0,0) 90%)}
.mstage::after{content:"";position:absolute;right:-70px;top:-70px;width:250px;height:640px;background:linear-gradient(180deg,rgba(79,227,236,.13),rgba(79,227,236,0) 75%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);filter:blur(16px);transform:rotate(17deg)}
.m .mbg{position:absolute;left:0;right:0;top:844px;bottom:0;pointer-events:none;background:#000}

/* top bar: sticky in the app, 60px + safe-area-inset-top */
.mtop{position:absolute;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:8px;height:60px;padding:0 14px 0 16px;background:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.66));border-bottom:1px solid rgba(255,255,255,.07);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.mtop .logo{width:30px;height:30px;border-radius:8px;box-shadow:0 0 0 1.5px #C6FF33,0 0 14px rgba(198,255,51,.35)}
.mtop .logo svg{width:16px;height:16px}
.mtop .word{margin-left:4px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;letter-spacing:.01em;text-transform:uppercase}
.mtop .tr{margin-left:auto;display:flex;align-items:center;gap:8px}
.mtop .coins{height:36px;gap:7px;padding:0 4px 0 9px;border-radius:10px;font-size:14px}
.mtop .coins .gem{width:17px;height:17px;border-radius:5px}
.mtop .coins .add{width:28px;height:28px;border-radius:7px}
.mtop .coins .add svg{width:15px;height:15px}
.mtop .ibtn{width:38px;height:38px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 3px 0 #000}
.mtop .ibtn svg{width:18px;height:18px}
.mtop .bell .dotc{right:-5px;top:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:5px;font-size:10px;line-height:17px}
.mtop .meb{position:relative;display:flex;padding:0;border:0;background:none;cursor:pointer;border-radius:10px}
.mtop .meb .ava{width:38px;height:38px;border-radius:10px;font-size:16px;box-shadow:0 0 0 1.5px #E0B52E}
.mtop .ttl{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.mtop .back{box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 3px 0 #000}

/* bottom tab bar: fixed in the app, 62px + safe-area-inset-bottom (22 here) */
.mtab{position:absolute;left:0;right:0;bottom:0;z-index:30;height:84px;padding:0 4px 22px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:linear-gradient(180deg,rgba(15,15,19,.95),rgba(6,6,9,.98));border-top:1px solid rgba(255,255,255,.09);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.mtab::before{content:"";position:absolute;left:50%;top:-1px;width:84px;height:1px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(198,255,51,0),rgba(198,255,51,.8),rgba(198,255,51,0))}
.mtab a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;padding-top:9px;color:#8E8E9C;text-decoration:none;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:9.5px;line-height:1;letter-spacing:.14em;text-transform:uppercase}
.mtab a .ti{display:flex;align-items:center;justify-content:center;width:50px;height:30px;border-radius:9px;transition:background .2s,color .2s}
.mtab a svg{width:20px;height:20px}
.mtab a[aria-current="page"]{color:#fff}
.mtab a[aria-current="page"] .ti{color:#0A0A0A;background:#C6FF33;box-shadow:0 0 18px rgba(198,255,51,.35)}
.mtab a:focus-visible{outline:none}
.mtab a:focus-visible .ti{box-shadow:0 0 0 2px #fff}
.mtab .bdg{position:absolute;left:calc(50% + 9px);top:4px;min-width:17px;height:17px;padding:0 4px;border-radius:5px;background:#00BCC8;color:#00191B;font:700 10px/17px 'Space Grotesk',sans-serif;letter-spacing:0;text-align:center;box-shadow:0 0 0 2px #0B0B0F}
/* the raised Play diamond */
.mtab a.play{color:#C6FF33}
.mtab .pw{position:relative;width:60px;height:30px}
.mtab .pw i{position:absolute;left:10px;width:40px;height:40px;border-radius:11px;transform:rotate(45deg)}
.mtab .pw .lip{top:-18px;background:#5E7F0E;box-shadow:0 0 0 4px #0A0A0D}
.mtab .pw .fc{top:-23px;background:linear-gradient(135deg,#E4FF8C 0%,#C6FF33 50%,#A5DD1A 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 0 26px rgba(198,255,51,.45);animation:playglow 2.6s ease-in-out infinite}
.mtab .pw svg{position:absolute;left:50%;top:-12px;width:24px;height:24px;margin-left:-12px;color:#0A0A0A}
.mtab a.play[aria-current="page"] .fc{box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 0 0 3px #0A0A0D,0 0 0 5px #fff}
@keyframes playglow{0%,100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 0 18px rgba(198,255,51,.35)}50%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 0 32px rgba(198,255,51,.65)}}

/* page */
.mpage{position:relative;z-index:1;display:flex;flex-direction:column;gap:16px;padding:78px 16px 110px}
.mpage > *{flex-shrink:0}
.mh{display:flex;flex-direction:column}
.mh h1{margin:10px 0 0;font-size:46px;line-height:.9}
.mh .sub{margin:10px 0 0;font-size:14px;line-height:1.45}
.m .lbl{font-size:10.5px;letter-spacing:.2em}
.m .ph h2{font-size:17px}
.m .panel{border-radius:16px}
.m .muted{font-size:13px}
.m .muted2{font-size:12px}
.m .body{font-size:14px}
.sec{display:flex;flex-direction:column;gap:12px}
.sech{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sech h2{margin:0;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;line-height:1;letter-spacing:-.01em;text-transform:uppercase}
.sech p{margin:6px 0 0;font-size:12.5px;font-weight:600;color:#A4A4B2}

/* buttons at phone size: 52 / 44 tall, full-width where they lead a card */
.m .btn{height:52px;padding:0 20px;font-size:15px;border-radius:12px}
.m .btn.sm{height:44px;padding:0 16px;font-size:13px;border-radius:11px}
.m .btn svg{width:18px;height:18px}
.m .btn.sm svg{width:16px;height:16px}
.m .btn.full{width:100%}
.m .ibtn{width:44px;height:44px}

/* tabs: equal-width segments that fill the row */
.m .tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;padding:4px;border-radius:13px}
.m .tabs button{justify-content:center;gap:6px;height:40px;padding:0 6px;border-radius:9px;font-size:10.5px;letter-spacing:.1em}
.m .tabs button svg{width:15px;height:15px}
.m .tabs button .n{min-width:18px;height:18px;line-height:18px;font-size:10px}
.m .tabs.ic button svg{display:none}

/* horizontal scrollers bleed to the screen edge */
.hs{display:flex;gap:12px;margin:0 -16px;padding:0 16px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;scroll-padding:0 16px}
.hs::-webkit-scrollbar{display:none}
.hs > *{flex:none;scroll-snap-align:start}

/* list rows */
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.row .tx{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:5px}
.row .tx b{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;line-height:1;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx span{font-size:12.5px;font-weight:600;color:#A4A4B2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* bottom sheet */
.mscrim{position:absolute;left:0;right:0;top:0;height:844px;z-index:50;background:rgba(0,0,0,.66);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:scrimIn .25s ease-out both}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;padding:10px 16px 34px;border-radius:24px 24px 0 0;background:linear-gradient(180deg,#17171D 0%,#0B0B0E 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 -30px 60px rgba(0,0,0,.8);animation:sheetUp .42s cubic-bezier(.2,.9,.25,1) both}
.sheet::before{content:"";display:block;width:40px;height:5px;margin:0 auto 14px;border-radius:3px;background:rgba(255,255,255,.28)}
.sheet.tick::after{content:"";position:absolute;left:50%;top:0;width:120px;height:2px;transform:translateX(-50%);background:linear-gradient(90deg,rgba(198,255,51,0),#C6FF33,rgba(198,255,51,0))}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}

/* toast */
.toast{position:absolute;left:16px;right:16px;z-index:45;display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;border-radius:14px;background:rgba(10,10,14,.96);box-shadow:inset 3px 0 0 #C6FF33,inset 0 0 0 1px rgba(255,255,255,.12),0 16px 30px -10px rgba(0,0,0,.9);font-size:14px;font-weight:600;animation:fade .3s ease-out both}
.toast svg{width:18px;height:18px;color:#C6FF33}

/* chip tabs: a scrolling row when the labels don't fit as equal segments */
.chips{display:flex;gap:8px;margin:0 -16px;padding:0 16px;overflow-x:auto;scrollbar-width:none;scroll-padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:0;border-radius:10px;cursor:pointer;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:#BEBECA;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.chips button svg{width:15px;height:15px}
.chips button[aria-pressed="true"]{background:#C6FF33;color:#0A0A0A;box-shadow:none}
.chips button .n{min-width:18px;height:18px;padding:0 5px;border-radius:5px;background:#00BCC8;color:#00191B;font-size:10px;line-height:18px;letter-spacing:0;text-align:center}
.chips button[aria-pressed="true"] .n{background:#0A0A0A;color:#C6FF33}
.chips button:focus-visible,.m .tabs button:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* one phone viewport, for sheets and dialogs on a long board (in the app: position fixed, inset 0) */
.mview{position:absolute;left:0;right:0;height:844px;z-index:50;overflow:hidden}
.acts2{display:flex;flex-direction:column;gap:4px}
.acts2 a,.acts2 button{display:flex;align-items:center;gap:14px;width:100%;height:52px;padding:0 14px;border:0;border-radius:12px;background:rgba(255,255,255,.035);color:#E4E4EA;text-decoration:none;font-family:'Inter Tight',sans-serif;font-size:15px;font-weight:600;text-align:left;cursor:pointer}
.acts2 svg{width:19px;height:19px;color:#8E8E9C}
.acts2 .danger{color:#FF6B80}.acts2 .danger svg{color:#FF6B80}

/* ================= turning the phone ================= */
/* the illustration: a phone that turns sideways, a landscape table drawn inside it */
.turn{position:relative;flex:none;width:132px;height:132px;display:flex;align-items:center;justify-content:center}
.turn .arc{position:absolute;inset:0;width:132px;height:132px;color:#C6FF33;opacity:.9}
.turn .ph{position:relative;width:62px;height:108px;border-radius:15px;background:#0B0B0F;box-shadow:inset 0 0 0 2.5px #E8E8EE,inset 0 0 0 6px #0B0B0F,0 0 0 1px rgba(255,255,255,.08),0 18px 30px -10px rgba(0,0,0,.9),0 0 34px -6px rgba(0,188,200,.55);animation:turnPhone 2.8s cubic-bezier(.6,0,.3,1) infinite}
.turn .ph::before{content:"";position:absolute;left:50%;top:7px;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:#2A2A33}
.turn .scr{position:absolute;left:8px;right:8px;top:14px;bottom:14px;border-radius:7px;overflow:hidden;background:radial-gradient(closest-side,rgba(0,188,200,.55),rgba(0,188,200,0)),#06121A}
.turn .scr i{position:absolute;left:50%;top:50%;width:66px;height:30px;margin:-15px 0 0 -33px;border-radius:50%;transform:rotate(90deg);background:#06323A;box-shadow:0 0 0 2px #C6FF33,0 0 10px rgba(198,255,51,.6)}
.turn .scr b{position:absolute;left:50%;top:50%;width:9px;height:13px;margin:-6px 0 0 -4px;border-radius:2px;background:#fff;transform:rotate(90deg)}
@keyframes turnPhone{0%,18%{transform:rotate(0deg)}46%,82%{transform:rotate(-90deg)}100%{transform:rotate(0deg)}}
@media (prefers-reduced-motion:reduce){.turn .ph{animation:none;transform:rotate(-90deg)}}
.turn.sm{width:96px;height:96px}
.turn.sm .arc{width:96px;height:96px}
.turn.sm .ph{width:46px;height:80px;border-radius:12px}
.turn.sm .scr{left:6px;right:6px;top:11px;bottom:11px;border-radius:5px}
.turn.sm .scr i{width:48px;height:22px;margin:-11px 0 0 -24px}
.turn.sm .scr b{width:7px;height:10px;margin:-5px 0 0 -3px}
.hint2{display:flex;align-items:flex-start;gap:9px;font-size:12px;line-height:1.45;font-weight:500;color:#A4A4B2}
.hint2 svg{flex:none;width:15px;height:15px;margin-top:1px;color:#00BCC8}
.tring{position:relative;flex:none;width:30px;height:30px}
.tring svg{position:absolute;inset:0;width:30px;height:30px;transform:rotate(-90deg)}
.tring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}

/* ================= app screens on a phone held sideways ================= */
/* the tab bar stands up as a rail on the left; the page is one centred column */
.land .mtop{left:76px;height:52px;padding:0 14px 0 18px}
.land .mpage{margin-left:76px;padding:68px 104px 40px}
.mrail{position:absolute;left:0;top:0;bottom:0;z-index:31;width:76px;display:flex;flex-direction:column;align-items:center;padding:8px 0;background:linear-gradient(90deg,rgba(15,15,19,.97),rgba(8,8,11,.97));border-right:1px solid rgba(255,255,255,.09)}
.mrail::before{content:"";position:absolute;right:-1px;top:190px;width:1px;height:84px;background:linear-gradient(180deg,rgba(198,255,51,0),rgba(198,255,51,.8),rgba(198,255,51,0))}
.mrail .logo{margin:7px 0 16px;width:30px;height:30px;border-radius:8px;box-shadow:0 0 0 1.5px #C6FF33,0 0 14px rgba(198,255,51,.35)}
.mrail .logo svg{width:16px;height:16px}
.mrail a{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:76px;padding:5px 0;color:#8E8E9C;text-decoration:none;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:9px;line-height:1;letter-spacing:.12em;text-transform:uppercase}
.mrail a .ti{display:flex;align-items:center;justify-content:center;width:48px;height:30px;border-radius:9px}
.mrail a svg{width:19px;height:19px}
.mrail a[aria-current="page"]{color:#fff}
.mrail a[aria-current="page"] .ti{color:#0A0A0A;background:#C6FF33;box-shadow:0 0 18px rgba(198,255,51,.35)}

/* ================= the opening deal: cut for first play, then the deal ================= */
/* card layer inside .table: everything below is laid out in table space (1200 x 740) */
.ccl{position:absolute;left:0;top:0;width:1200px;height:740px;transform-style:preserve-3d;pointer-events:none}
.cc{position:absolute;left:0;top:0;transform-style:preserve-3d;transform-origin:50% 100%;opacity:1;transition:transform .6s cubic-bezier(.25,.8,.25,1),opacity 0s linear;will-change:transform}
.cc.sm{width:96px;height:134px;font-size:13.333px}
.cc.lg{width:120px;height:168px;font-size:16.667px}
.cc > .back,.cc > .fr{-webkit-backface-visibility:hidden;backface-visibility:hidden}
.cc > .fr{position:absolute;inset:0}
.cc.lg > .back{transform:rotateY(180deg)}
.cc.sm > .back{box-shadow:0 1.5px 0 #D9D9E2,0 2.5px 0 #9A9AA8,0 6px 10px -4px rgba(0,0,0,.55)}
.cc.lg > .back{box-shadow:0 2px 0 #D9D9E2,0 3px 0 #9A9AA8,0 16px 22px -10px rgba(0,0,0,.7)}
.cc .face{box-shadow:0 1px 0 #DCDCE4,0 2px 0 #C6C6D0,0 3px 0 #ABABB8,0 18px 26px -10px rgba(0,0,0,.8);transition:box-shadow .35s,filter .35s}
.cc.hid{opacity:0}
.cc.win .face{box-shadow:0 1px 0 #D5D5DE,0 2px 0 #B5B5C2,0 0 0 4px #C6FF33,0 0 46px 12px rgba(198,255,51,.5)}
.cc.dim .face{filter:brightness(.6) saturate(.75)}
/* the riffle: halves split, then drop back in one at a time */
.cc.rif{animation:rsplit .28s cubic-bezier(.3,.7,.3,1) both,rdrop .16s cubic-bezier(.5,0,.75,.6) forwards;animation-delay:0s,var(--dd)}
@keyframes rsplit{from{transform:var(--from)}to{transform:var(--side)}}
@keyframes rdrop{from{transform:var(--side)}to{transform:var(--to)}}
/* dealt cards arc off the deck and land on the seat's pile */
.cc.go{animation:fly .33s cubic-bezier(.3,.6,.35,1) both}
@keyframes fly{0%{transform:var(--from)}45%{transform:var(--mid)}100%{transform:var(--to)}}
.cc.flip{animation:flip .52s cubic-bezier(.3,.6,.3,1) both}
@keyframes flip{0%{transform:var(--from)}50%{transform:var(--mid)}100%{transform:var(--to)}}
.cc.pick{animation:pick .42s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes pick{from{transform:var(--to);opacity:1}to{transform:var(--gone);opacity:0}}
.cc.fade{opacity:0;transition:opacity .35s ease-out}
/* the upcard (gin) turns over beside the stock */
.frozen .cc,.reset .cc,.reset .hc,.reset .swap > *{transition:none !important;animation:none !important}
/* the winner's glow on the felt, and a standee over the card */
.halo{position:absolute;left:0;top:0;width:320px;height:320px;margin:-160px 0 0 -160px;border-radius:50%;background:radial-gradient(closest-side,rgba(198,255,51,.42),rgba(198,255,51,.12) 55%,rgba(198,255,51,0));transform:translateZ(.8px) scale(.4);opacity:0;transition:opacity .45s,transform .6s cubic-bezier(.2,.9,.3,1)}

/* seat plates during the ceremony */

// The engine has already settled the cut and the deal; this only presents them.
// Board supplies GEO (table-space geometry) and LAY (screen layout) above this block.
const PIP = {2:[[50,0],[50,100,1]],3:[[50,0],[50,50],[50,100,1]],4:[[0,0],[100,0],[0,100,1],[100,100,1]],5:[[0,0],[100,0],[50,50],[0,100,1],[100,100,1]],6:[[0,0],[100,0],[0,50],[100,50],[0,100,1],[100,100,1]],7:[[0,0],[100,0],[50,25],[0,50],[100,50],[0,100,1],[100,100,1]],8:[[0,0],[100,0],[50,25],[0,50],[100,50],[50,75,1],[0,100,1],[100,100,1]],9:[[0,0],[100,0],[0,33.3],[100,33.3],[50,50],[0,66.7,1],[100,66.7,1],[0,100,1],[100,100,1]],10:[[0,0],[100,0],[50,16.7],[0,33.3],[100,33.3],[0,66.7,1],[100,66.7,1],[50,83.3,1],[0,100,1],[100,100,1]]};
const WORD = { A: 'Ace', K: 'King', Q: 'Queen', J: 'Jack' };
const SUITW = { S: 'spades', H: 'hearts', D: 'diamonds', C: 'clubs' };
function card(rank, suit, foil) {
  const n = +rank || 0;
  return {
    rank: rank, suit: suit, tone: (suit === 'H' || suit === 'D' ? 'red' : 'blk') + (foil && rank === '10' ? ' ten' : ''),
    isAce: rank === 'A', isCourt: rank === 'J' || rank === 'Q' || rank === 'K', isPips: n >= 2 && n <= 10,
    pips: (PIP[n] || []).map(function (p) { return { x: p[0], y: p[1], f: p[2] ? 'flip' : '' }; }),
    label: (WORD[rank] || rank) + ' of ' + SUITW[suit], short: (WORD[rank] || rank) + ' of ' + SUITW[suit]
  };
}

const GAMES = {
  'Mindi': {
    key: 'mindi', title: 'Mindi', thaana: 'މިންޑި', big: 'MINDI', order: ['S', 'W', 'N', 'E'], dealer: 'E', hand: 13, gap: 40,
    names: { S: 'Sayyu', W: 'Ibrahim', N: 'Mariyam', E: 'Shifa' }, role: { S: 'You', W: 'Opponent', N: 'Partner', E: 'Opponent' },
    team: { S: 'us', W: 'them', N: 'us', E: 'them' },
    cut: { S: ['9', 'C'], W: ['J', 'D'], N: ['A', 'H'], E: ['6', 'S'] }, winner: 'N',
    mine: [['A', 'S'], ['10', 'S'], ['7', 'S'], ['3', 'S'], ['K', 'H'], ['9', 'H'], ['4', 'H'], ['Q', 'C'], ['8', 'C'], ['5', 'C'], ['J', 'D'], ['10', 'D'], ['2', 'D']]
  },
  'Gin Rummy': {
    key: 'gin', title: 'Gin Rummy', thaana: 'ޖިން ރަމީ', big: 'GIN', order: ['S', 'N'], dealer: 'N', hand: 10, gap: 62,
    names: { S: 'Sayyu', N: 'Hussain' }, role: { S: 'You', N: 'Opponent' }, team: { S: 'us', N: 'them' },
    cut: { S: ['K', 'C'], N: ['8', 'D'] }, winner: 'S', up: ['6', 'C'],
    mine: [['A', 'S'], ['4', 'S'], ['9', 'S'], ['7', 'H'], ['K', 'H'], ['5', 'C'], ['Q', 'C'], ['3', 'D'], ['8', 'D'], ['J', 'D']]
  }
};
const PHASES = ['Play through', 'Cut', 'Reveal', 'First player', 'Deal', 'Ready'];

function timeline(g) {
  const T = { spread: 1150, draw: 1900, gather: 2750, reveal: 3150, first: 4350, deal: 5650, fly: 6150, dur: 330 };
  const n = g.order.length * g.hand;
  T.lastLand = T.fly + (n - 1) * g.gap + T.dur;
  T.up = g.key === 'gin' ? T.lastLand + 80 : null;
  T.ready = (g.key === 'gin' ? T.up + T.dur + 120 : T.lastLand + 160);
  T.loop = T.ready + 5400;
  return T;
}
function phaseAt(t, T) {
  if (t < T.spread) return 'shuffle';
  if (t < T.draw) return 'spread';
  if (t < T.gather) return 'draw';
  if (t < T.reveal) return 'gather';
  if (t < T.first) return 'reveal';
  if (t < T.deal) return 'first';
  if (t < T.fly) return 'collect';
  if (t < T.ready) return 'deal';
  return 'ready';
}
const STEP = { shuffle: 0, spread: 0, draw: 0, gather: 0, reveal: 1, first: 2, collect: 3, deal: 3, ready: 4 };
const f1 = function (v) { return Math.round(v * 10) / 10; };

// Cards pivot on their near edge (transform-origin 50% 100%) so they can stand up.
// place() takes the card's centre on the felt and works out the translate for that pivot.
function place(cx, cy, z, rz, rx, ry, s, w, h) {
  const a = rz * Math.PI / 180, hh = h / 2 * s;
  const bx = cx - hh * Math.sin(a), by = cy + hh * Math.cos(a);
  return 'translate3d(' + f1(bx - w / 2) + 'px,' + f1(by - h) + 'px,' + f1(z) + 'px) rotateZ(' + f1(rz) + 'deg) rotateX(' + f1(rx) + 'deg) rotateY(' + f1(ry) + 'deg) scale(' + s + ')';
}
const SM = GEO.sm || [96, 134], LG = GEO.lg || [120, 168], NDECK = 26;
function arcAt(k) {
  const u = k / (NDECK - 1) * 2 - 1;
  return { x: GEO.deck[0] + u * GEO.arc.half, y: GEO.arc.y - GEO.arc.bow * (1 - u * u), rz: u * GEO.arc.tilt, z: 1 + k * .35 };
}
function sm(p, z, rz) { return place(p[0], p[1], z, rz || 0, 0, 0, 1, SM[0], SM[1]); }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tick: 0, reset: false };
    this.t0 = 0; this.key = ''; this.timer = null;
  }
  game() { return GAMES[this.props.game] || GAMES['Mindi']; }
  mode() { return this.props.phase || 'Play through'; }
  componentDidMount() { this.restart(); this.timer = setInterval(() => this.poll(), 45); }
  componentWillUnmount() { clearInterval(this.timer); }
  restart() {
    this.t0 = Date.now(); this.key = '';
    this.setState({ reset: true, tick: this.state.tick + 1 });
    setTimeout(() => this.setState({ reset: false }), 60);
  }
  elapsed() {
    const g = this.game(), T = timeline(g), m = this.mode();
    if (m === 'Cut') return 2600;
    if (m === 'Reveal') return 4150;
    if (m === 'First player') return 5000;
    if (m === 'Deal') return T.fly + Math.round(g.order.length * g.hand * .55) * g.gap + 190;
    if (m === 'Ready') return T.ready + 1600;
    return Date.now() - this.t0;
  }
  counts(t, g, T) {
    const c = {}; g.order.forEach(function (s) { c[s] = 0; });
    if (t < T.fly) return c;
    const n = g.order.length * g.hand;
    for (let j = 0; j < n; j++) { if (t >= T.fly + j * g.gap + T.dur) c[g.order[j % g.order.length]]++; }
    return c;
  }
  poll() {
    const g = this.game(), T = timeline(g);
    if (this.mode() !== 'Play through') { if (this.key !== 'static:' + this.mode() + g.key) { this.key = 'static:' + this.mode() + g.key; this.setState({ tick: this.state.tick + 1 }); } return; }
    const t = this.elapsed();
    if (t >= T.loop) { this.restart(); return; }
    const ph = phaseAt(t, T), c = this.counts(t, g, T);
    const k = g.key + ph + JSON.stringify(c);
    if (k !== this.key) { this.key = k; this.setState({ tick: this.state.tick + 1 }); }
  }
  skip() {
    const T = timeline(this.game());
    if (this.mode() !== 'Play through') return;
    const t = this.elapsed();
    if (t < T.deal) { this.t0 = Date.now() - T.deal; this.key = ''; this.poll(); }
  }

  renderVals() {
    const g = this.game(), T = timeline(g), live = this.mode() === 'Play through';
    const t = this.elapsed(), ph = phaseAt(t, T), step = STEP[ph], gin = g.key === 'gin';
    const m = g.order.length, n = m * g.hand, DD = GEO.dealDeck[g.key], D = GEO.deck;
    const slots = GEO.slots[g.key];
    const win = g.winner, winCard = card(g.cut[win][0], g.cut[win][1], false);
    const cnt = this.counts(t, g, T);

    // ---- the deck (26 cards stand in for the pack while it is shuffled, spread and gathered)
    const deck = [];
    for (let k = 0; k < NDECK; k++) {
      const drawnBy = slots.indexOf(k), o = k % 2 === 0 ? k / 2 : 13 + (k - 1) / 2, left = k % 2 === 1;
      let tf = sm(D, 1 + k), hid = false, cls = '', dl = 0;
      const vars = {};
      if (ph === 'shuffle') {
        cls = live ? 'rif' : '';
        vars.from = sm(D, 1 + o);
        vars.side = place(D[0] + (left ? -GEO.riffle : GEO.riffle), D[1] + 8, 17 + (left ? o - 13 : o), left ? -11 : 11, 0, left ? -18 : 18, 1, SM[0], SM[1]);
        vars.dd = (300 + k * 26) + 'ms';
      } else if (ph === 'spread') { const a = arcAt(k); tf = place(a.x, a.y, a.z, a.rz, 0, 0, 1, SM[0], SM[1]); dl = k * 7; }
      else if (ph === 'draw') { const a = arcAt(k); tf = place(a.x, a.y, a.z, a.rz, 0, 0, 1, SM[0], SM[1]); if (drawnBy >= 0) { hid = true; dl = drawnBy * 170; } }
      else if (ph === 'gather' || ph === 'reveal' || ph === 'first' || ph === 'collect') { tf = sm(DD, 1 + k, GEO.deckRz[g.key]); hid = drawnBy >= 0; dl = ph === 'gather' ? (NDECK - 1 - k) * 9 : 0; }
      else if (ph === 'deal') { tf = sm(DD, 1 + k, GEO.deckRz[g.key]); hid = !gin; }
      else { tf = gin ? sm(GEO.stock, 1 + k * .9) : sm(DD, 1 + k); hid = !gin; }
      deck.push({ tf: tf, cls: (hid ? 'hid ' : '') + cls, dl: dl, from: vars.from || 'none', side: vars.side || 'none', dd: vars.dd || '0ms' });
    }

    // ---- one cut card per seat
    const cuts = g.order.map(function (s, i) {
      const sp = GEO.cut[s], a = arcAt(slots[i]), c = card(g.cut[s][0], g.cut[s][1], false);
      const down = place(sp[0], sp[1], 3, sp[2], 0, 180, 1, LG[0], LG[1]), up = place(sp[0], sp[1], 3, 0, 0, 0, 1, LG[0], LG[1]);
      const mid = place(sp[0], sp[1] - 10, 64, sp[2] / 2, 0, 90, 1.04, LG[0], LG[1]);
      let tf = place(a.x, a.y, a.z + .5, a.rz, 0, 180, .8, LG[0], LG[1]), hid = true, dl = 0, cls = '', ad = 0;
      if (ph === 'draw' || ph === 'gather') { tf = down; hid = false; dl = ph === 'draw' ? i * 170 : 0; }
      else if (ph === 'reveal') { tf = up; hid = false; if (live) { cls = 'flip'; ad = i * 150; } }
      else if (ph === 'first') {
        hid = false;
        tf = s === win ? place(GEO.center[0], GEO.center[1], GEO.winZ || 14, 0, -(GEO.winRx !== undefined ? GEO.winRx : GEO.rx), 0, GEO.winS || 1.1, LG[0], LG[1]) : up;
        cls = s === win ? 'win' : 'dim';
      }
      else if (ph === 'collect') { tf = place(DD[0], DD[1], 28 + i, GEO.deckRz[g.key], 0, 180, .8, LG[0], LG[1]); hid = false; dl = i * 70; }
      return { tf: tf, cls: (hid ? 'hid ' : '') + cls, dl: dl, ad: ad, from: down, mid: mid, c: c, win: s === win && ph === 'first' && GEO.standee !== false };
    });

    // ---- the deal: every card flies from the dealer's deck to its seat's pile
    const dealt = [], td = t - T.fly;
    for (let j = 0; j < n; j++) {
      const s = g.order[j % m], r = Math.floor(j / m), P = GEO.pile[s];
      const jx = ((r * 37) % 5 - 2) * .9, jy = ((r * 53) % 5 - 2) * .9, jr = ((r * 29) % 7 - 3) * 1.3;
      const from = sm(DD, 1 + (gin ? NDECK : 0) + (n - j) * .5, GEO.deckRz[g.key]);
      const to = place(P[0] + jx, P[1] + jy, 1 + r * .6, P[2] + jr, 0, 0, 1, SM[0], SM[1]);
      const mid = place((DD[0] + P[0]) / 2, (DD[1] + P[1]) / 2, 70, (GEO.deckRz[g.key] + P[2] + jr) / 2, 0, 0, 1, SM[0], SM[1]);
      const gone = place(P[0], P[1] + (GEO.goneY || 150), GEO.goneZ || 150, 0, -24, 0, 1, SM[0], SM[1]);
      let tf = from, cls = 'hid', ad = 0;
      if (ph === 'deal') {
        if (live) { tf = to; cls = 'go'; ad = j * g.gap; }
        else { const st = j * g.gap; tf = td >= st + T.dur ? to : td >= st ? mid : from; cls = ''; }
      } else if (ph === 'ready') {
        tf = to;
        if (s === 'S') { cls = live ? 'pick' : 'hid'; ad = r * 22; } else cls = 'fade';
      }
      dealt.push({ tf: tf, cls: cls, from: from, mid: mid, to: to, gone: gone, ad: ad });
    }
    // gin: the top card turns up to start the discard pile
    const upc = gin ? card(g.up[0], g.up[1], false) : card('2', 'S', false);
    let upTf = place(DD[0], DD[1], NDECK + 2, GEO.deckRz[g.key], 0, 180, 1, SM[0], SM[1]), upCls = 'hid', upAd = 0;
    const upTo = place(GEO.upcard[0], GEO.upcard[1], 2, -4, 0, 0, 1, SM[0], SM[1]);
    const upMid = place((DD[0] + GEO.upcard[0]) / 2, (DD[1] + GEO.upcard[1]) / 2, 80, 0, 0, 90, 1, SM[0], SM[1]);
    if (gin && ph === 'deal') { if (live) { upTf = upTo; upCls = 'go'; upAd = T.up - T.fly; } else { upTf = t >= T.up + T.dur ? upTo : upTf; upCls = t >= T.up ? '' : 'hid'; } }
    if (gin && ph === 'ready') { upTf = upTo; upCls = ''; }

    // ---- seats
    const us = this;
    const plates = g.order.map(function (s) {
      const c = g.cut[s], revealed = step >= 1, isWin = s === win;
      let line = g.role[s], suit = '', red = false;
      if (step >= 1 && step < 4) { line = (isWin && step >= 2) ? 'First to play' : 'Drew ' + (c[0] === 'A' ? 'A' : c[0]); suit = (isWin && step >= 2) ? '' : c[1]; red = c[1] === 'H' || c[1] === 'D'; }
      if (step === 4) { line = s === win ? (s === 'S' ? 'Your turn' : 'Leads') : (s === 'S' ? 'Waiting' : g.role[s]); }
      const count = step >= 3 ? cnt[s] : 0;
      return {
        style: LAY.plates[s], init: g.names[s][0], name: g.names[s], them: g.team[s] === 'them' ? 'them' : '',
        line: line, suit: suit, hasSuit: !!suit, suitCls: red ? 'red' : '', dealer: s === g.dealer && step < 4,
        cls: (isWin && step >= 2 ? 'first' : ''), count: count, ctCls: step >= 3 ? '' : 'off', dotCls: g.team[s] === 'them' ? 'them' : ''
      };
    });
    const fans = g.order.filter(function (s) { return s !== 'S'; }).map(function (s) {
      return { style: LAY.fans[s], cls: step === 4 ? '' : 'off', backs: [-14, -7, 0, 7, 14].map(function (a) { return { a: a }; }) };
    });
    const rows = g.order.map(function (s) {
      const c = g.cut[s], shown = step >= 1;
      return {
        init: g.names[s][0], them: g.team[s] === 'them' ? 'them' : '', name: g.names[s] + (s === 'S' ? ' · you' : ''),
        shown: shown, hidden: !shown, rank: c[0], suit: c[1], red: (c[1] === 'H' || c[1] === 'D') ? 'red' : '',
        rs: !shown ? (step === 0 && (ph === 'draw' || ph === 'gather') ? 'Drew a card' : 'Waiting') : (s === win && step >= 2 ? 'First to play' : card(c[0], c[1]).label),
        cls: s === win && step >= 2 ? 'win' : ''
      };
    });

    // ---- words
    const dn = g.names[g.dealer], wn = g.names[win];
    const winLine = win === 'S' ? (gin ? 'You take the first turn.' : 'You lead the first trick.')
      : (g.team[win] === 'us' ? 'Your team leads the first trick.' : wn + ' leads the first trick.');
    const W = {
      shuffle: ['Shuffle', dn + ' deals this hand. First, everyone cuts one card.', dn + ' is shuffling'],
      spread: ['Cut for first play', 'One card each. The highest card plays first.', 'The pack is spread for the cut'],
      draw: ['Cut for first play', 'One card each. The highest card plays first.', 'Everyone draws one card'],
      gather: ['Cut for first play', 'One card each. The highest card plays first.', 'Everyone draws one card'],
      reveal: ['Reveal', 'Ace is high. A tie for the top card is cut again.', 'Turning the cards over'],
      first: [win === 'S' ? 'You play first' : wn + ' plays first', winCard.label + ' is the highest card. ' + winLine, winCard.label + ' wins the cut'],
      collect: ['Deal', gin ? '10 cards each, then the top card turns up to start the discard pile.' : '13 cards each, one at a time, from ' + dn + "'s left.", dn + ' is dealing'],
      deal: ['Deal', gin ? '10 cards each, then the top card turns up to start the discard pile.' : '13 cards each, one at a time, from ' + dn + "'s left.", dn + ' is dealing'],
      ready: ['', '', win === 'S' ? (gin ? 'Your turn. Take the 6 or draw from the stock.' : 'Your turn. Lead any card.') : wn + ' leads the first trick']
    }[ph];

    const ptitle = { shuffle: dn + ' shuffles', spread: 'Cut for first play', draw: 'Cut for first play', gather: 'Cut for first play', reveal: 'Reveal · ace high',
      first: W[0], collect: dn + ' deals · ' + g.hand + ' each', deal: dn + ' deals · ' + g.hand + ' each', ready: '' }[ph];

    // ---- your hand, once it is picked up
    const hn = g.mine.length, L = LAY.hand[g.key];
    const hand = g.mine.map(function (h, i) {
      const o = i - (hn - 1) / 2;
      return { c: card(h[0], h[1], !gin), x: Math.round(L.cx + o * L.dx), y: Math.round(L.y + o * o * L.curve), r: +(o * L.rot).toFixed(2), i: i, z: i + 1 };
    });
    const steps = ['Cut', 'Reveal', 'First', 'Deal'].map(function (l, i) { return { label: l, cls: i < step ? 'done' : i === step ? 'now' : '' }; });

    return {
      rootCls: (live ? '' : 'frozen') + (this.state.reset ? ' reset' : ''), ptitle: ptitle, feltColor: gin ? '#0A2429' : '#06323A', gameTitle: g.title, thaana: g.thaana, big: g.big, isGin: gin, isMindi: !gin,
      deck: deck, cuts: cuts, dealt: dealt, upc: upc, upTf: upTf, upCls: upCls, upAd: upAd, upFrom: place(DD[0], DD[1], NDECK + 2, GEO.deckRz[g.key], 0, 180, 1, SM[0], SM[1]), upMid: upMid, upTo: upTo,
      haloX: GEO.center[0], haloY: GEO.center[1], haloCls: ph === 'first' ? 'on' : '',
      headLine: step === 4 ? (gin ? 'Melds of 4, 3 and 3 win · No knocking' : 'Trick 1 / 13') : 'Opening deal',
      leftLabel: step === 4 ? (gin ? 'Your melds' : 'Score') : 'Opening deal', rightLabel: step === 4 ? (gin ? 'Turn' : 'Trump') : 'The cut',
      narrate: step < 4, notReady: step < 4, readyMindi: step === 4 && !gin, readyGin: step === 4 && gin, pskip: step >= 3 ? 'Dealing…' : 'Skip', pwait: gin ? 'Draw first' : 'Wait', waitOff: true, rH: gin ? (step < 4 ? 140 : 116) : (step < 4 ? 228 : 131),
      plates: plates, fans: fans, rows: rows, steps: steps, stepN: Math.min(step + 1, 4),
      title: W[0], sub: W[1], status: W[2], statusDot: ph === 'ready' && win === 'S',
      cerCls: step === 4 ? 'out' : '', tabCls: step === 4 ? '' : 'out', ready: step === 4, dealing: ph === 'collect' || ph === 'deal',
      skipOff: step >= 3, skipLabel: step >= 3 ? 'Dealing…' : 'Skip to deal', skip: () => us.skip(),
      hand: hand, handShow: step === 4, lead: wn, youLead: win === 'S', waitLabel: gin ? (win === 'S' ? 'Draw first' : 'Wait for ' + wn) : (win === 'S' ? 'Pick a card' : 'Wait for ' + wn),
      handCount: g.hand
    };
  }
}
